<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Do List CMYD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --navy:#0755a5;
  --navy-2:#0b63bd;
  --brown:#e69a13;
  --bg:#f2f6fc;
  --card:#ffffff;
  --line:#dce6f3;
  --text:#173454;
  --muted:#71839b;
  --accent:#2875ed;
  --ok:#079447;
  --warn:#f28a16;
  --bad:#e91645;
  --radius:15px;
  --shadow:0 3px 12px rgba(24,67,116,.065);
  --shadow-hover:0 7px 20px rgba(24,67,116,.11);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{
  margin:0;
  font-family:Inter,"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:13px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid rgba(40,117,237,.2);outline-offset:2px
}

/* HEADER – trắng, xanh Long Châu */
.top{
  background:rgba(255,255,255,.97);
  color:var(--navy);
  position:sticky;top:0;z-index:50;
  border-bottom:1px solid #dce7f4;
  box-shadow:0 2px 12px rgba(19,66,119,.07);
  backdrop-filter:blur(12px);
}
.top-in{
  max-width:1600px;margin:0 auto;padding:10px 22px;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;min-height:66px
}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.logo{
  width:43px;height:43px;border-radius:12px;
  background:linear-gradient(145deg,#2875ed,#0755a5);
  color:#fff;display:grid;place-items:center;font-size:21px;
  box-shadow:0 4px 10px rgba(40,117,237,.2)
}
.brand h1{margin:0;font-size:18px;font-weight:900;letter-spacing:-.55px;color:#0755a5}
.brand p{margin:1px 0 0;font-size:10px;font-weight:700;letter-spacing:.65px;color:#8a9bb1;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
  background:#f3f7fd;border:1px solid #e1eaf5;color:#536b87;
  padding:7px 12px;border-radius:999px
}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}
.dot.ok{background:#12a45a;box-shadow:0 0 0 3px rgba(18,164,90,.12)}
.dot.err{background:#e91645;box-shadow:0 0 0 3px rgba(233,22,69,.1)}
.dot.load{background:#f5a623;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.auto{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#60748e;cursor:pointer}
.auto input{accent-color:#1769ce;width:15px;height:15px}
.top select{
  background:#f7faff;border:1px solid #dce6f3;color:#315579;
  border-radius:9px;padding:7px 9px;font-size:11px;font-weight:600
}
.top select option{color:#111}
.btn{
  border:1px solid #dce6f3;background:#fff;border-radius:10px;
  padding:8px 14px;font-weight:700;font-size:12px;
  transition:all .18s ease;box-shadow:0 1px 2px rgba(20,50,90,.03)
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{
  background:linear-gradient(135deg,#2875ed,#0755a5);
  border-color:#1767cf;color:#fff;box-shadow:0 4px 10px rgba(40,117,237,.2)
}
.btn.primary:hover{background:linear-gradient(135deg,#3985f5,#0b63bd);color:#fff}
.btn.spin .ic{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* LAYOUT & CARD */
.wrap{
  max-width:1600px;margin:0 auto;padding:20px 22px 28px;
  display:grid;grid-template-columns:340px minmax(0,1fr);
  gap:20px;align-items:start
}
.side{
  position:sticky;top:84px;display:flex;flex-direction:column;gap:12px;
  max-height:calc(100vh - 100px);overflow:auto;padding:1px 3px 5px 1px
}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:15px;
  box-shadow:var(--shadow);transition:box-shadow .18s,border-color .18s
}
.card h3{
  margin:0 0 11px;font-size:11px;text-transform:uppercase;
  letter-spacing:.65px;color:#526b89;font-weight:800
}
.side .card{border-top:3px solid #d8e8fb}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:11px;color:#72849b;font-weight:700}
.field select,.field input{
  border:1px solid #dce6f3;border-radius:9px;padding:8px 10px;
  background:#fbfdff;width:100%;font-size:12px;color:#294968;
  transition:border-color .15s,box-shadow .15s
}
.field select:focus,.field input:focus{border-color:#6da4f2;outline:0;box-shadow:0 0 0 3px rgba(40,117,237,.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid #dce6f3;background:#f9fbff;border-radius:999px;
  padding:6px 10px;font-size:11px;font-weight:700;color:#49627e;
  transition:all .15s;display:inline-flex;align-items:center;gap:6px
}
.chip:hover{border-color:#78a9ef;color:#0755a5;background:#f0f6ff}
.chip.on{background:#0755a5;border-color:#0755a5;color:#fff;box-shadow:0 3px 8px rgba(7,85,165,.16)}
.chip .n{font-size:10px;opacity:.72;font-weight:600}
.chip.cat.on{background:var(--c);border-color:var(--c)}
.chip.cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.cat.on::before{background:#fff}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd .chip{justify-content:center;padding:7px 0;border-radius:9px}
.clear{width:100%;margin-top:1px;background:#fff7f7;border-color:#ffd5dc;color:#d51d43}
.clear:hover{background:#fff0f2;border-color:#f5a5b5;color:#c9153a}

/* SEARCH */
.searchcard{padding:16px 18px;border-top:3px solid #2875ed}
.sbox{position:relative}
.sbox input{
  width:100%;border:1.5px solid #dce6f3;border-radius:12px;
  padding:13px 46px 13px 46px;font-size:14px;font-weight:500;
  outline:none;transition:.18s;background:#f8fbff;color:#173454
}
.sbox input::placeholder{color:#9aabc0}
.sbox input:focus{border-color:#4388ed;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.sbox .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.65}
.sbox .sx{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  border:0;background:#e8eff9;color:#54708f;width:28px;height:28px;
  border-radius:50%;display:none;font-weight:700
}
.sbox.has .sx{display:block}
.kw{margin-top:12px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.kw .chip{font-weight:600;background:#f2f7ff;border-color:#e0eaf8}
.hint{margin-top:8px;font-size:11px;color:#8292a8}

/* STATS – KPI cards có mã màu */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 17px}
.stat{
  position:relative;overflow:hidden;background:#fff;
  border:1px solid #dce6f3;border-radius:13px;padding:13px 14px;
  display:flex;flex-direction:column;gap:3px;
  border-left:4px solid var(--c,#2875ed);
  box-shadow:var(--shadow);min-height:82px
}
.stat:after{
  content:"";position:absolute;width:65px;height:65px;border-radius:50%;
  right:-23px;top:-27px;background:var(--tint,rgba(40,117,237,.07))
}
.stat b{font-size:23px;line-height:1.2;font-weight:900;letter-spacing:-.7px;color:var(--c,#0755a5);position:relative;z-index:1}
.stat span{font-size:10.5px;color:#73869e;font-weight:700;position:relative;z-index:1}
.stat:nth-child(1){--c:#0755a5;--tint:#e5f0ff}
.stat:nth-child(2){--c:#e91645;--tint:#fff0f3}
.stat:nth-child(3){--c:#e88713;--tint:#fff5e8}
.stat:nth-child(4){--c:#079447;--tint:#e9f9f0}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}

/* TABS */
.tabs{
  display:flex;gap:5px;border-bottom:1px solid #dce6f3;
  margin-bottom:15px;flex-wrap:wrap;background:#fff;
  border-radius:12px 12px 0 0;padding:5px 7px 0;
  box-shadow:0 1px 4px rgba(24,67,116,.035)
}
.tab{
  border:0;background:none;padding:10px 14px;font-weight:800;
  font-size:11px;color:#74869d;border-bottom:3px solid transparent;
  margin-bottom:-1px;border-radius:9px 9px 0 0;
  display:flex;gap:7px;align-items:center;transition:.15s
}
.tab:hover{color:#0755a5;background:#f1f6ff}
.tab.on{color:#0755a5;border-bottom-color:#e99a16;background:#f5f9ff}
.badge{background:#e91645;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px}

/* RESULTS */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rhead .cnt{font-weight:800;color:#174e8b;font-size:12px}
.rhead select{border:1px solid #dce6f3;border-radius:9px;padding:7px 10px;background:#fff;color:#45617f;font-size:11px;font-weight:600}
.summary{
  background:linear-gradient(110deg,#fff8e9,#fff);
  border:1px solid #f6d99e;border-left:4px solid #f0a11b;
  border-radius:13px;padding:14px 16px;margin-bottom:14px
}
.summary b{color:#a65a08}
.summary .chips{margin-top:8px}
.pill{
  display:inline-flex;align-items:center;gap:8px;background:#eef5ff;
  border:1px solid #c9defb;color:#17569a;padding:6px 11px;
  border-radius:999px;font-size:11px;margin-bottom:12px
}
.pill button{border:0;background:#d6e6fb;color:#17569a;border-radius:50%;width:19px;height:19px;line-height:1;font-size:11px}
.day{
  display:grid;grid-template-columns:88px minmax(0,1fr);
  background:#fff;border:1px solid #dce6f3;border-radius:14px;
  margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow);
  scroll-margin-top:90px;transition:box-shadow .18s,border-color .18s
}
.day:hover{box-shadow:var(--shadow-hover);border-color:#c8d9ee}
.day.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px #f2b43c}100%{box-shadow:var(--shadow)}}
.dbadge{
  background:linear-gradient(160deg,#2875ed,#0755a5);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 6px;text-align:center
}
.dbadge .wk{font-size:10px;font-weight:800;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;margin-bottom:7px}
.dbadge .dn{font-size:29px;font-weight:900;line-height:1;letter-spacing:-1px}
.dbadge .mn{font-size:10px;font-weight:600;opacity:.88;margin-top:4px}
.day.we .dbadge{background:linear-gradient(160deg,#e9a52b,#c77a0b)}
.day.today .dbadge{background:linear-gradient(160deg,#12a45a,#087a40)}
.day.future .dbadge{background:linear-gradient(160deg,#8b68e8,#6340be)}
.dbody{padding:12px 15px}
.dmeta{display:flex;gap:8px;align-items:center;margin-bottom:9px;font-size:11px;color:#7b8da3;flex-wrap:wrap}
.dmeta b{color:#254d76;font-size:12px;font-weight:800}
.tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:#e7f8ef;color:#078247}
.tag.f{background:#f0ebff;color:#7048c7}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.task{
  display:flex;gap:10px;align-items:flex-start;padding:8px 10px;
  border-radius:10px;background:#f7faff;border:1px solid #edf2f9;
  border-left:3px solid var(--c);transition:background .15s
}
.task:hover{background:#f0f6ff}
.cat-l{
  flex:none;font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:.25px;color:#fff;background:var(--c);
  padding:3px 8px;border-radius:6px;margin-top:1px;
  min-width:72px;text-align:center
}
.task .t{flex:1;word-break:break-word;color:#344e6d;font-size:12px;font-weight:500}
mark{background:#ffedaa;color:#7b4b00;border-radius:3px;padding:0 2px}
.empty{
  text-align:center;padding:48px 20px;color:#8292a8;background:#fff;
  border:1px dashed #cbd9e9;border-radius:14px
}
.empty .big{font-size:34px}

/* CALENDAR */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap}
.calhead h2{margin:0;font-size:15px;font-weight:900;color:#0755a5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-weight:800;font-size:10px;color:#71849c;padding:5px 0}
.cal .h.we{color:#d88912}
.cell{
  min-height:82px;border:1px solid #e0e8f2;border-radius:10px;
  background:#fff;padding:7px 8px;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:.14s;cursor:pointer
}
.cell.blank{background:transparent;border:0;cursor:default}
.cell .d{font-weight:800;font-size:12px;color:#365573}
.cell .c{font-size:10px;color:#7c8ea4;font-weight:600}
.cell.has{background:#f0f6ff;border-color:#c7dcfb}
.cell.has:hover{border-color:#4e91ed;transform:translateY(-1px);box-shadow:0 3px 9px rgba(40,117,237,.1)}
.cell.has .c{color:#0755a5;font-weight:800}
.cell.today .d{background:#079447;color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cell.sel{outline:3px solid #f1b53e;outline-offset:1px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px;font-size:10px;color:#71849c}

/* AI ANALYSIS */
.ai-intro{
  background:linear-gradient(115deg,#0755a5,#2875ed 65%,#48a3d9);
  color:#fff;border-radius:14px;padding:17px 19px;margin-bottom:17px;
  box-shadow:0 5px 14px rgba(20,94,174,.16);position:relative;overflow:hidden
}
.ai-intro:after{content:"✦";position:absolute;right:20px;top:-25px;font-size:100px;color:rgba(255,255,255,.1)}
.ai-intro h2{margin:0 0 5px;font-size:15px;font-weight:900;position:relative;z-index:1}
.ai-intro p{margin:0;font-size:11px;opacity:.9;position:relative;z-index:1}
.sec{margin-bottom:19px}
.sec>h3{font-size:13px;margin:0 0 4px;display:flex;align-items:center;gap:8px;color:#174e8b;font-weight:900}
.sec>p{margin:0 0 10px;font-size:11px;color:var(--muted)}
.item{
  background:#fff;border:1px solid #e0e8f2;border-left:4px solid var(--c,#2875ed);
  border-radius:11px;padding:11px 13px;margin-bottom:8px;
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  box-shadow:0 1px 4px rgba(24,67,116,.035)
}
.item .ttl{font-weight:700;color:#294c70;font-size:12px}
.item .sub{font-size:10.5px;color:#8191a6;margin-top:3px}
.item .chips{margin-top:8px}
.kind{
  font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.35px;
  padding:3px 8px;border-radius:6px;color:#fff;background:var(--c);
  display:inline-block;margin-bottom:5px
}
.when{flex:none;text-align:right;font-size:11px;font-weight:800;color:var(--c)}
.when small{display:block;font-weight:500;color:var(--muted)}
.mini{font-size:11px;padding:5px 10px}
.err{background:#fff1f2;border:1px solid #ffcbd3;color:#a51d38;border-radius:13px;padding:16px}
.err .chips{margin-top:10px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{
  background:#123d70;color:#fff;padding:11px 16px;border-radius:11px;
  box-shadow:0 7px 24px rgba(0,0,0,.18);animation:in .25s;max-width:340px;
  font-size:12px;font-weight:600
}
@keyframes in{from{transform:translateY(10px);opacity:0}}
.foot{text-align:center;color:#91a0b3;font-size:10px;padding:14px 0 28px}

/* RESPONSIVE */
@media(min-width:1500px){
  .wrap{grid-template-columns:360px minmax(0,1fr);gap:24px}
  .stats{gap:12px}
}
@media(max-width:960px){
  .wrap{grid-template-columns:1fr;padding:15px}
  .side{position:static;max-height:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .side .clear{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top-in{padding:10px 15px}
}
@media(max-width:600px){
  body{font-size:12px}
  .top-in{padding:9px 12px;gap:10px}
  .brand{min-width:0}
  .brand h1{font-size:15px}
  .brand p{font-size:9px}
  .logo{width:37px;height:37px}
  .top-actions{gap:7px}
  .sync{font-size:10px;padding:6px 9px}
  .auto{font-size:10px}
  .top select{padding:6px;font-size:10px}
  .btn{padding:7px 10px;font-size:10px}
  .wrap{padding:11px;gap:13px}
  .side{grid-template-columns:1fr;gap:9px}
  .card{padding:12px;border-radius:12px}
  .stats{gap:8px;margin:11px 0 13px}
  .stat{padding:10px 11px;min-height:72px}
  .stat b{font-size:20px}
  .stat span{font-size:9.5px}
  .tabs{gap:2px;padding:4px 4px 0;overflow-x:auto;flex-wrap:nowrap}
  .tab{white-space:nowrap;padding:9px 10px;font-size:10px}
  .day{grid-template-columns:66px minmax(0,1fr);border-radius:11px}
  .dbadge{padding:9px 4px}
  .dbadge .dn{font-size:23px}
  .dbadge .wk{font-size:9px;padding:2px 7px}
  .dbody{padding:10px}
  .task{gap:7px;padding:7px 8px}
  .cat-l{min-width:60px;font-size:8px;padding:3px 5px}
  .task .t{font-size:11px}
  .cell{min-height:58px;padding:5px 4px;gap:3px}
  .cell .d{font-size:11px}
  .cell .c{font-size:9px}
  .cal{gap:3px}
  .item{padding:10px;gap:8px}
  .when{font-size:10px}
  .foot{padding-bottom:18px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo">📋</div>
      <div><h1>Tra cứu việc đã làm</h1><p id="rangeInfo">Đang tải dữ liệu…</p></div>
    </div>
    <div class="top-actions">
      <div class="sync"><span id="dot" class="dot"></span><span id="syncText">Chưa đồng bộ</span></div>
      <label class="auto"><input type="checkbox" id="autoChk"><span>Tự động cập nhật</span></label>
      <select id="autoSec" title="Chu kỳ tự động cập nhật">
        <option value="30">30 giây</option><option value="60">1 phút</option><option value="300">5 phút</option>
      </select>
      <button class="btn primary" id="btnRefresh" data-act="refresh"><span class="ic">⟳</span> Cập nhật dữ liệu</button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside class="side">
    <div class="card">
      <h3>Khoảng thời gian</h3>
      <div class="chips" style="margin-bottom:12px">
        <button class="chip" data-act="quick" data-r="all">Tất cả</button>
        <button class="chip" data-act="quick" data-r="today">Hôm nay</button>
        <button class="chip" data-act="quick" data-r="week">Tuần này</button>
        <button class="chip" data-act="quick" data-r="last7">7 ngày qua</button>
        <button class="chip" data-act="quick" data-r="month">Tháng này</button>
      </div>
      <div class="field"><label for="fMonth">Tháng</label><select id="fMonth"></select></div>
      <div class="field"><label for="fWeek">Tuần</label><select id="fWeek"></select></div>
      <div class="row2">
        <div class="field"><label for="fFrom">Từ ngày</label><input type="date" id="fFrom"></div>
        <div class="field"><label for="fTo">Đến ngày</label><input type="date" id="fTo"></div>
      </div>
    </div>
    <div class="card">
      <h3>Thứ trong tuần</h3>
      <div class="wd" id="wdBox"></div>
    </div>
    <div class="card">
      <h3>Loại công việc</h3>
      <div class="chips" id="catBox"></div>
    </div>
    <button class="btn clear" data-act="clear">✕ Xóa tất cả bộ lọc</button>
  </aside>

  <main>
    <section class="card searchcard">
      <div class="sbox" id="sbox">
        <span class="si">🔍</span>
        <input id="q" type="search" placeholder="Tìm công việc… ví dụ: 247, Elearning, infographic, workshop" autocomplete="off">
        <button class="sx" data-act="clearq" title="Xóa từ khóa">✕</button>
      </div>
      <div class="hint">Không phân biệt hoa/thường và dấu tiếng Việt. Nhiều từ = công việc phải chứa tất cả các từ.</div>
      <div class="kw" id="kwBox"></div>

    <section class="stats" id="stats"></section>
    <nav class="tabs" id="tabs"></nav>

    <div class="foot">Mỗi công việc chỉ thuộc đúng một ngày ghi trong bảng và không kéo sang ngày khác.</div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ========================= CẤU HÌNH ========================= */
const CONFIG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTn7OOPemvTWej5Z4i5FEcrW8oWOQ4asvuiONJzHyfYkZqShvGmNkDtSclOTNNudpUI_hhGCD0wKBB1/pub?output=csv',
  USE_PROXY_FALLBACK: true,      // thử qua proxy CORS nếu trình duyệt chặn truy cập trực tiếp
  AUTO_DEFAULT_ON: true,         // bật tự động cập nhật mặc định
  AUTO_DEFAULT_SEC: 60
};

/* ========================= TIỆN ÍCH ========================= */
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fold = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD_FULL = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
const WD_SHORT = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fmtDM = d => `${d.getDate()}/${d.getMonth() + 1}`;
const fmtDMY = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;

/* ========================= ĐỌC CSV ========================= */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

/* ========================= NHẬN DIỆN BỐ CỤC ========================= */
const DATE_RE = /^\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?\s*$/;

function parseWd(label) {
  const f = fold(label || '');
  if (/\bcn\b|chu nhat/.test(f)) return 0;
  const m = /thu\s*(\d)/.exec(f);
  if (m) { const n = +m[1]; if (n >= 2 && n <= 7) return n - 1; }
  return null;
}

function resolveYear(d, mo, yExp, label, prev, now) {
  if (yExp) return yExp < 100 ? 2000 + yExp : yExp;
  const wd = parseWd(label);
  const ref = prev || now;
  let best = null;
  for (const y of [ref.getFullYear() - 1, ref.getFullYear(), ref.getFullYear() + 1]) {
    const dt = new Date(y, mo - 1, d);
    if (dt.getMonth() !== mo - 1) continue;
    if (wd !== null && dt.getDay() !== wd) continue;
    const diff = Math.abs(dt - ref);
    if (!best || diff < best.diff) best = { y, diff };
  }
  return best ? best.y : ref.getFullYear();
}

function splitTasks(cell) {
  if (!cell) return [];
  const lines = cell.replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean);
  const bullet = /^[-–—•·*▪●+]\s*/;
  const out = [];
  if (lines.some(l => bullet.test(l))) {
    for (const l of lines) {
      if (bullet.test(l)) out.push(l.replace(bullet, '').trim());
      else if (out.length) out[out.length - 1] += ' ' + l;
      else out.push(l);
    }
  } else lines.forEach(l => out.push(l));
  return out.map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
}

const CATS = [
  { id: 'workshop', name: 'Workshop / Đào tạo', color: '#059669', re: /workshop|dao tao|townhall|tap huan|buoi chia se/ },
  { id: 'demo', name: 'Demo', color: '#7c3aed', re: /\bdemo\b/ },
  { id: 'hop', name: 'Họp', color: '#2563eb', re: /\bhop\b|trien khai chuong trinh/ },
  { id: 'test', name: 'Test / Kiểm thử', color: '#d97706', re: /\btest\b|kiem thu/ },
  { id: 'design', name: 'Infographic / Thiết kế', color: '#db2777', re: /infographic|thiet ke|slide|\bhdsd\b|video/ },
  { id: 'report', name: 'Báo cáo / Tổng hợp', color: '#0891b2', re: /tong hop|cap nhat|bao cao|ra soat|chuan bi|so lieu|ti le|tinh hinh/ },
  { id: 'support', name: 'Hỗ trợ / Phân công', color: '#4f46e5', re: /ho tro|phan cong|toi uu/ },
  { id: 'other', name: 'Khác', color: '#64748b', re: /./ }
];
const catOf = f => CATS.find(c => c.re.test(f));

function parseSchedule(rows, now = new Date()) {
  const days = [], weeks = []; let prev = null, wIdx = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const cols = [];
    for (let j = 0; j < r.length; j++) {
      const m = DATE_RE.exec((r[j] || '').trim());
      if (m) cols.push({ j, d: +m[1], mo: +m[2], y: m[3] ? +m[3] : null });
    }
    if (cols.length < 3) continue;
    const wdRow = rows[i - 1] || [], taskRow = rows[i + 1] || [];
    const block = [];
    for (const c of cols) {
      if (c.mo < 1 || c.mo > 12 || c.d < 1 || c.d > 31) continue;
      const y = resolveYear(c.d, c.mo, c.y, wdRow[c.j], prev, now);
      const date = new Date(y, c.mo - 1, c.d);
      if (date.getMonth() !== c.mo - 1) continue;
      prev = date;
      block.push({ key: dkey(date), date, wd: date.getDay(), week: wIdx + 1, rawTasks: splitTasks(taskRow[c.j]) });
    }
    if (!block.length) continue;
    wIdx++;
    block.forEach(b => { b.week = wIdx; days.push(b); });
    weeks.push({ idx: wIdx, from: block[0].date, to: block[block.length - 1].date });
  }
  const map = new Map();
  for (const d of days) {
    if (!map.has(d.key)) map.set(d.key, { ...d, tasks: [] });
    const day = map.get(d.key);
    d.rawTasks.forEach(text => {
      const folded = fold(text), cat = catOf(folded);
      day.tasks.push({ id: `${d.key}#${day.tasks.length}`, dayKey: d.key, text, folded, cat: cat.id });
    });
  }
  const out = [...map.values()].sort((a, b) => a.date - b.date);
  return { days: out, weeks };
}

/* ========================= PHÂN TÍCH GỢI Ý ========================= */
const STOP_SIM = new Set(['va', 'cua', 'cac', 'nhung', 'mot', 'la', 'de', 've', 'voi', 'tai', 'trong', 'cho', 'nay', 'da', 'se', 'den', 'tu', 'co', 'duoc', 'o']);
const STOP_KW = new Set([...STOP_SIM, 'hop', 'tham', 'du', 'buoi', 'lam', 'tinh', 'nang', 'moi', 'du', 'kien', 'tiep', 'theo', 'cong', 'viec', 'tuan', 'ngay', 'thang', 'quy', 'hang', 'cap', 'nhat', 'ho', 'tro', 'so', 'sanh', 'an', 'dinh', 'ky']);
const tokensOf = f => new Set(f.replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, ' ').split(/[^a-z0-9]+/).filter(w => w.length > 1 && !STOP_SIM.has(w)));
const jac = (a, b) => { let i = 0; a.forEach(x => { if (b.has(x)) i++; }); const u = a.size + b.size - i; return u ? i / u : 0; };

function analyze(days, today = startOfDay(new Date())) {
  const all = [];
  days.forEach(d => d.tasks.forEach(t => { t.tokens = tokensOf(t.folded); t.day = d; all.push(t); }));
  const todayMs = today.getTime();

  /* 1. Nhóm việc lặp lại */
  const groups = [];
  for (const t of all) {
    if (t.tokens.size < 2) continue;
    const g = groups.find(g => g.items.some(i => jac(i.tokens, t.tokens) >= 0.55));
    if (g) g.items.push(t); else groups.push({ rep: t, items: [t] });
  }
  const recurring = [];
  for (const g of groups) {
    const keys = [...new Set(g.items.map(t => t.dayKey))].sort();
    if (keys.length < 2) continue;
    const dates = keys.map(k => g.items.find(t => t.dayKey === k).day.date);
    const cnt = {}; g.items.forEach(t => cnt[t.text] = (cnt[t.text] || 0) + 1);
    const text = Object.entries(cnt).sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0][0];
    const wdc = {}; dates.forEach(d => wdc[d.getDay()] = (wdc[d.getDay()] || 0) + 1);
    const [topWd, topN] = Object.entries(wdc).sort((a, b) => b[1] - a[1])[0];
    const share = topN / dates.length;
    const gaps = []; for (let i = 1; i < dates.length; i++) gaps.push(Math.round((dates[i] - dates[i - 1]) / 864e5));
    const med = gaps.slice().sort((a, b) => a - b)[Math.floor(gaps.length / 2)];
    const weekly = med >= 6 && med <= 8 && share >= 0.6;
    const last = dates[dates.length - 1];
    let next = null;
    if (weekly && (todayMs - last.getTime()) / 864e5 <= 28) {
      let d = new Date(Math.max(todayMs, addDays(last, 1).getTime()));
      while (d.getDay() !== +topWd) d = addDays(d, 1);
      next = d;
    }
    recurring.push({
      text, keys, days: keys.length, ids: g.items.map(t => t.id), cat: g.items[0].cat,
      topWd: +topWd, share, weekly, last, next, med,
      pattern: weekly ? `Lặp lại hằng tuần vào ${WD_FULL[+topWd]}` : (share >= 0.6 ? `Thường vào ${WD_FULL[+topWd]}` : `Xuất hiện rải rác (khoảng ${med} ngày/lần)`)
    });
  }
  recurring.sort((a, b) => b.days - a.days || b.last - a.last);

  /* 2. Nhắc việc sắp tới */
  const upcoming = [];
  for (const t of all) {
    if (t.day.date.getTime() >= todayMs) upcoming.push({ kind: 'sched', when: t.day.date, title: t.text, sub: `Đã ghi trong lịch ngày ${fmtDMY(t.day.date)}`, ids: [t.id] });
    const re = /(?<!\d)(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?(?!\d)/g; let m;
    while ((m = re.exec(t.text))) {
      const dd = +m[1], mm = +m[2];
      if (mm < 1 || mm > 12 || dd < 1 || dd > 31) continue;
      let y = m[3] ? +m[3] : t.day.date.getFullYear();
      let dt = new Date(y, mm - 1, dd);
      if (!m[3] && dt < t.day.date) dt = new Date(y + 1, mm - 1, dd);
      if (dt.getMonth() !== mm - 1) continue;
      if (dt.getTime() >= todayMs && dkey(dt) !== t.dayKey) upcoming.push({ kind: 'mention', when: dt, title: t.text, sub: `Nhắc đến ngày ${fmtDMY(dt)} (ghi ngày ${fmtDMY(t.day.date)})`, ids: [t.id] });
    }
  }
  recurring.filter(r => r.next).forEach(r => upcoming.push({ kind: 'predict', when: r.next, title: r.text, sub: `${r.pattern} · đã làm ${r.days} lần, gần nhất ${fmtDMY(r.last)}`, ids: r.ids }));
  upcoming.sort((a, b) => a.when - b.when);

  /* 3. Cần theo dõi */
  const FU = /tiep theo|tiep tuc|hang tuan|du kien|phan cong|toi uu lai|follow|deadline|ke hoach|chua xong|can hoan thanh/;
  const follow = [];
  const recent = all.filter(t => t.day.date <= addDays(today, 0) && t.day.date >= addDays(today, -14)).sort((a, b) => b.day.date - a.day.date);
  for (const t of recent) {
    const m = FU.exec(t.folded);
    if (!m) continue;
    if (follow.some(f => jac(f.t.tokens, t.tokens) >= 0.55)) continue;
    follow.push({ t, kw: m[0] });
    if (follow.length >= 8) break;
  }

  /* 4. Từ khóa nổi bật */
  const kwMap = new Map();
  for (const t of all) {
    const seen = new Set();
    for (const w of t.text.split(/[^\p{L}\p{N}]+/u)) {
      if (w.length < 2) continue;
      const f = fold(w);
      if (STOP_KW.has(f) || /^\d{1,2}$/.test(f) || /^\d{4}$/.test(f) || seen.has(f)) continue;
      seen.add(f);
      const e = kwMap.get(f) || { days: new Set(), forms: {} };
      e.days.add(t.dayKey); const lw = w.toLowerCase(); e.forms[lw] = (e.forms[lw] || 0) + 1;
      kwMap.set(f, e);
    }
  }
  const keywords = [...kwMap.values()].filter(e => e.days.size >= 2)
    .map(e => ({ word: Object.entries(e.forms).sort((a, b) => b[1] - a[1])[0][0], n: e.days.size }))
    .sort((a, b) => b.n - a.n || a.word.localeCompare(b.word)).slice(0, 10);

  return { recurring, upcoming, follow, keywords };
}

/* ========================= TRẠNG THÁI ========================= */
const state = {
  days: [], weeks: [], tasks: [], dayMap: new Map(), ai: null, sig: '', lastSync: null, loading: false, error: null,
  tab: 'search', sort: 'desc', calMonth: null, calSel: null,
  f: { q: '', month: '', week: '', from: '', to: '', wd: new Set(), cats: new Set(), ids: null, idsLabel: '' }
};
const $ = s => document.querySelector(s);
const catById = id => CATS.find(c => c.id === id);
const todayStart = () => startOfDay(new Date());

/* ========================= NẠP DỮ LIỆU ========================= */
async function fetchCSV() {
  const sep = CONFIG.CSV_URL.includes('?') ? '&' : '?';
  const url = CONFIG.CSV_URL + sep + '_t=' + Date.now();
  const attempts = [url];
  if (CONFIG.USE_PROXY_FALLBACK) {
    attempts.push('https://corsproxy.io/?' + encodeURIComponent(url));
    attempts.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
  }
  let lastErr;
  for (const u of attempts) {
    try {
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 20000);
      const res = await fetch(u, { cache: 'no-store', signal: ctrl.signal }); clearTimeout(to);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('Link không trả về CSV (kiểm tra đã "Xuất bản lên web" định dạng CSV chưa)');
      return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Không tải được dữ liệu');
}

function ingest(text) {
  const rows = parseCSV(text);
  const { days, weeks } = parseSchedule(rows);
  if (!days.length) throw new Error('Không nhận diện được bố cục (không tìm thấy dòng ngày dạng 28/9).');
  state.days = days; state.weeks = weeks;
  state.dayMap = new Map(days.map(d => [d.key, d]));
  state.tasks = days.flatMap(d => d.tasks);
  state.ai = analyze(days, todayStart());
  state.sig = state.tasks.map(t => t.id + '|' + t.text).join('\n');
  if (!state.calMonth) {
    const tk = dkey(todayStart()).slice(0, 7);
    const months = monthsList();
    state.calMonth = months.includes(tk) ? tk : months[months.length - 1];
  }
}

async function loadData(manual = false) {
  if (state.loading) return;
  state.loading = true; setStatus('load', 'Đang cập nhật…');
  $('#btnRefresh').classList.add('spin');
  const before = new Set(state.tasks.map(t => t.dayKey + '|' + t.text));
  try {
    const text = await fetchCSV();
    ingest(text);
    try { localStorage.setItem('wl_csv', text); } catch (e) {}
    state.error = null; state.lastSync = new Date();
    setStatus('ok', 'Đã cập nhật lúc ' + state.lastSync.toLocaleTimeString('vi-VN'));
    if (before.size) {
      const now = new Set(state.tasks.map(t => t.dayKey + '|' + t.text));
      let add = 0, del = 0; now.forEach(k => { if (!before.has(k)) add++; }); before.forEach(k => { if (!now.has(k)) del++; });
      if (add || del) toast(`Dữ liệu mới: +${add} việc${del ? `, −${del} việc đã sửa/xóa` : ''}`);
      else if (manual) toast('Dữ liệu đã là mới nhất, không có thay đổi.');
    } else if (manual) toast('Đã tải xong dữ liệu.');
  } catch (e) {
    let cached = null; try { cached = localStorage.getItem('wl_csv'); } catch (x) {}
    if (cached && !state.days.length) {
      try { ingest(cached); setStatus('err', 'Offline – đang dùng dữ liệu đã lưu'); toast('Không tải được link, đang hiển thị dữ liệu đã lưu lần trước.'); }
      catch (x) { state.error = e.message; setStatus('err', 'Lỗi tải dữ liệu'); }
    } else if (state.days.length) { setStatus('err', 'Lỗi cập nhật – giữ dữ liệu cũ'); toast('Cập nhật thất bại: ' + e.message); }
    else { state.error = e.message; setStatus('err', 'Lỗi tải dữ liệu'); }
  } finally {
    state.loading = false; $('#btnRefresh').classList.remove('spin'); renderAll();
  }
}
function setStatus(cls, txt) { $('#dot').className = 'dot ' + cls; $('#syncText').textContent = txt; }
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 4500);
}

/* Tự động cập nhật */
let autoTimer = null;
function setupAuto() {
  clearInterval(autoTimer);
  if ($('#autoChk').checked) autoTimer = setInterval(() => loadData(false), +$('#autoSec').value * 1000);
  try { localStorage.setItem('wl_auto', JSON.stringify({ on: $('#autoChk').checked, sec: $('#autoSec').value })); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && $('#autoChk').checked && state.lastSync && Date.now() - state.lastSync > 30000) loadData(false);
});

/* ========================= LỌC ========================= */
function monthsList() { return [...new Set(state.days.map(d => d.key.slice(0, 7)))].sort(); }
const terms = () => fold(state.f.q).split(/\s+/).filter(Boolean);

function dayPasses(d) {
  const f = state.f;
  if (f.month && d.key.slice(0, 7) !== f.month) return false;
  if (f.week && String(d.week) !== f.week) return false;
  if (f.wd.size && !f.wd.has(d.wd)) return false;
  if (f.from && d.key < f.from) return false;
  if (f.to && d.key > f.to) return false;
  return true;
}
function taskPasses(t, ts) {
  const f = state.f;
  if (f.cats.size && !f.cats.has(t.cat)) return false;
  if (f.ids && !f.ids.has(t.id)) return false;
  return ts.every(w => t.folded.includes(w));
}
function filtered() {
  const ts = terms(), out = [];
  for (const d of state.days) {
    if (!dayPasses(d)) continue;
    const tasks = d.tasks.filter(t => taskPasses(t, ts));
    if (tasks.length) out.push({ day: d, tasks });
  }
  out.sort((a, b) => state.sort === 'asc' ? a.day.date - b.day.date : b.day.date - a.day.date);
  return out;
}

function highlight(text, ts) {
  if (!ts.length) return esc(text);
  let folded = ''; const map = [];
  for (let i = 0; i < text.length; i++) { const f = fold(text[i]); for (const ch of f) { folded += ch; map.push(i); } }
  let ranges = [];
  for (const t of ts) { let p = 0; while ((p = folded.indexOf(t, p)) > -1) { ranges.push([map[p], map[p + t.length - 1] + 1]); p += t.length; } }
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [ranges[0]];
  for (let i = 1; i < ranges.length; i++) {
    const prev = merged[merged.length - 1], cur = ranges[i];
    if (cur[0] <= prev[1]) prev[1] = Math.max(prev[1], cur[1]); else merged.push(cur);
  }
  let out = '', last = 0;
  for (const [s, e] of merged) { out += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>'; last = e; }
  return out + esc(text.slice(last));
}

/* ========================= RENDER ========================= */
function renderAll() {
  renderSidebar();
  renderStats();
  renderTabs();
  renderView();
}

function renderSidebar() {
  if (!state.days.length) { $('#rangeInfo').textContent = 'Chưa có dữ liệu'; return; }
  const minD = state.days[0].date, maxD = state.days[state.days.length - 1].date;
  $('#rangeInfo').textContent = `${fmtDMY(minD)} – ${fmtDMY(maxD)} · ${state.tasks.length} công việc`;

  /* Tháng */
  const mSel = $('#fMonth'); const curM = state.f.month;
  mSel.innerHTML = '<option value="">Tất cả tháng</option>' + monthsList().map(m => {
    const [y, mm] = m.split('-'); return `<option value="${m}" ${curM === m ? 'selected' : ''}>Tháng ${+mm}/${y}</option>`;
  }).join('');

  /* Tuần */
  const wSel = $('#fWeek'); const curW = state.f.week;
  wSel.innerHTML = '<option value="">Tất cả tuần</option>' + state.weeks.map(w =>
    `<option value="${w.idx}" ${curW === String(w.idx) ? 'selected' : ''}>Tuần ${w.idx} (${fmtDM(w.from)} - ${fmtDM(w.to)})</option>`
  ).join('');

  /* Ngày nhập */
  $('#fFrom').value = state.f.from; $('#fTo').value = state.f.to;

  /* Thứ trong tuần */
  $('#wdBox').innerHTML = WD_ORDER.map(w =>
    `<button class="chip ${state.f.wd.has(w) ? 'on' : ''}" data-act="wd" data-v="${w}">${WD_SHORT[w]}</button>`
  ).join('');

  /* Loại công việc */
  const catCnt = {}; state.tasks.forEach(t => catCnt[t.cat] = (catCnt[t.cat] || 0) + 1);
  $('#catBox').innerHTML = CATS.map(c => {
    const n = catCnt[c.id] || 0; if (!n) return '';
    const on = state.f.cats.has(c.id);
    return `<button class="chip cat ${on ? 'on' : ''}" style="--c:${c.color}" data-act="cat" data-v="${c.id}">${c.name} <span class="n">${n}</span></button>`;
  }).join('');

  /* Từ khóa gợi ý */
  const kwBox = $('#kwBox');
  if (state.ai && state.ai.keywords.length) {
    kwBox.innerHTML = '<span>Gợi ý từ khóa:</span>' + state.ai.keywords.map(k =>
      `<button class="chip" data-act="kw" data-v="${esc(k.word)}">${esc(k.word)} <span class="n">${k.n} ngày</span></button>`
    ).join('');
  } else kwBox.innerHTML = '';

  $('#sbox').classList.toggle('has', !!state.f.q);
}

function renderStats() {
  const res = filtered();
  const totalDays = res.length;
  const totalTasks = res.reduce((s, r) => s + r.tasks.length, 0);
  const avg = totalDays ? (totalTasks / totalDays).toFixed(1) : 0;
  const catCnt = {}; res.forEach(r => r.tasks.forEach(t => catCnt[t.cat] = (catCnt[t.cat] || 0) + 1));
  const topCatId = Object.entries(catCnt).sort((a, b) => b[1] - a[1])[0]?.[0];
  const topCat = topCatId ? catById(topCatId) : null;

  $('#stats').innerHTML = `
    <div class="stat"><b>${totalTasks}</b><span>Công việc phù hợp</span></div>
    <div class="stat"><b>${totalDays}</b><span>Ngày có việc</span></div>
    <div class="stat"><b>${avg}</b><span>Việc trung bình / ngày</span></div>
    <div class="stat" style="--c:${topCat?.color || 'var(--navy)'}"><b>${topCat ? topCat.name.split('/')[0].trim() : '—'}</b><span>Loại việc nhiều nhất</span></div>
  `;
}

function renderTabs() {
  const upN = state.ai?.upcoming.length || 0;
  const recN = state.ai?.recurring.length || 0;
  const folN = state.ai?.follow.length || 0;
  $('#tabs').innerHTML = `
    <button class="tab ${state.tab === 'search' ? 'on' : ''}" data-act="tab" data-v="search">🔍 Tìm kiếm & Danh sách</button>
    <button class="tab ${state.tab === 'cal' ? 'on' : ''}" data-act="tab" data-v="cal">📅 Xem theo lịch</button>
    <button class="tab ${state.tab === 'ai' ? 'on' : ''}" data-act="tab" data-v="ai">✨ Phân tích AI ${upN ? `<span class="badge">${upN}</span>` : ''}</button>
  `;
}

function renderView() {
  const v = $('#view');
  if (state.error) {
    v.innerHTML = `<div class="err"><b>Lỗi nạp dữ liệu:</b> ${esc(state.error)}<div class="chips"><button class="btn primary" data-act="refresh">Thử lại</button></div></div>`;
    return;
  }
  if (!state.days.length) {
    v.innerHTML = '<div class="empty"><div class="big">⏳</div><p>Đang tải dữ liệu từ Google Sheets…</p></div>';
    return;
  }
  if (state.tab === 'search') renderSearchView(v);
  else if (state.tab === 'cal') renderCalView(v);
  else if (state.tab === 'ai') renderAiView(v);
}

function renderSearchView(v) {
  const res = filtered();
  const ts = terms();
  let html = `
    <div class="rhead">
      <div class="cnt">Hiển thị ${res.reduce((s, r) => s + r.tasks.length, 0)} công việc (${res.length} ngày)</div>
      <div>Sắp xếp ngày: <select id="sortSel"><option value="desc" ${state.sort === 'desc' ? 'selected' : ''}>Mới nhất trước</option><option value="asc" ${state.sort === 'asc' ? 'selected' : ''}>Cũ nhất trước</option></select></div>
    </div>
  `;
  if (state.f.idsLabel) {
    html += `<div class="pill">📌 Đang lọc: <b>${esc(state.f.idsLabel)}</b> <button data-act="clearids" title="Bỏ lọc">✕</button></div>`;
  }
  if (!res.length) {
    v.innerHTML = html + '<div class="empty"><div class="big">🔍</div><p>Không tìm thấy công việc nào phù hợp bộ lọc.</p></div>';
    return;
  }
  const tToday = dkey(todayStart());
  html += res.map(r => {
    const d = r.day;
    const isToday = d.key === tToday;
    const isFut = d.key > tToday;
    const isWe = d.wd === 0 || d.wd === 6;
    const cls = ['day', isToday ? 'today' : '', isFut ? 'future' : '', isWe ? 'we' : ''].filter(Boolean).join(' ');
    return `
      <article class="day ${cls}" id="day-${d.key}">
        <div class="dbadge">
          <span class="wk">T${d.week}</span>
          <span class="dn">${d.date.getDate()}</span>
          <span class="mn">Tháng ${d.date.getMonth() + 1}</span>
        </div>
        <div class="dbody">
          <div class="dmeta">
            <b>${WD_FULL[d.wd]}</b> · ${fmtDMY(d.date)}
            ${isToday ? '<span class="tag">Hôm nay</span>' : ''}
            ${isFut ? '<span class="tag f">Tương lai</span>' : ''}
            <span>(${r.tasks.length} việc)</span>
          </div>
          <ul class="tasks">
            ${r.tasks.map(t => {
              const c = catById(t.cat);
              return `<li class="task" style="--c:${c.color}">
                <span class="cat-l">${c.name.split('/')[0]}</span>
                <span class="t">${highlight(t.text, ts)}</span>
              </li>`;
            }).join('')}
          </ul>
        </div>
      </article>
    `;
  }).join('');
  v.innerHTML = html;
}

function renderCalView(v) {
  const months = monthsList();
  if (!months.length) return;
  const ym = state.calMonth || months[months.length - 1];
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const last = new Date(y, m, 0);
  const startWd = first.getDay();
  const leading = (startWd + 6) % 7; // Thứ 2 là 0

  const daysInMo = [];
  for (let d = 1; d <= last.getDate(); d++) daysInMo.push(new Date(y, m - 1, d));

  const map = state.dayMap;
  const tToday = dkey(todayStart());

  let html = `
    <div class="card" style="margin-bottom:16px">
      <div class="calhead">
        <h2>Lịch làm việc Tháng ${m}/${y}</h2>
        <div style="display:flex;gap:8px">
          <select id="calMoSel">${months.map(mk => {
            const [my, mm] = mk.split('-');
            return `<option value="${mk}" ${mk === ym ? 'selected' : ''}>Tháng ${+mm}/${my}</option>`;
          }).join('')}</select>
        </div>
      </div>
      <div class="cal">
        <div class="h">T2</div><div class="h">T3</div><div class="h">T4</div><div class="h">T5</div><div class="h">T6</div><div class="h">T7</div><div class="h we">CN</div>
  `;

  for (let i = 0; i < leading; i++) html += '<div class="cell blank"></div>';

  daysInMo.forEach(dt => {
    const dk = dkey(dt);
    const dayObj = map.get(dk);
    const isToday = dk === tToday;
    const isSel = state.calSel === dk;
    const cnt = dayObj ? dayObj.tasks.length : 0;

    let dotsHtml = '';
    if (dayObj && cnt) {
      const cats = [...new Set(dayObj.tasks.map(t => t.cat))].slice(0, 5);
      dotsHtml = `<div class="dots">${cats.map(c => `<i style="--c:${catById(c).color}"></i>`).join('')}</div>`;
    }

    const cls = ['cell', cnt ? 'has' : '', isToday ? 'today' : '', isSel ? 'sel' : ''].filter(Boolean).join(' ');
    html += `
      <div class="${cls}" data-act="calcell" data-dk="${dk}">
        <div class="d">${dt.getDate()}</div>
        ${cnt ? `<div class="c">${cnt} việc</div>${dotsHtml}` : ''}
      </div>
    `;
  });

  html += `</div>
    <div class="legend">
      <span>Chú thích loại việc:</span>
      ${CATS.map(c => `<span style="display:inline-flex;align-items:center;gap:4px"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c.color}"></i> ${c.name.split('/')[0]}</span>`).join(' ')}
    </div>
  </div>`;

  /* Nếu chọn 1 ngày trong lịch, hiện danh sách ngày đó ở dưới */
  if (state.calSel && map.has(state.calSel)) {
    const d = map.get(state.calSel);
    html += `
      <div class="card">
        <h3>Chi tiết ngày ${fmtDMY(d.date)} (${WD_FULL[d.wd]}) · ${d.tasks.length} công việc</h3>
        <ul class="tasks" style="margin-top:10px">
          ${d.tasks.map(t => {
            const c = catById(t.cat);
            return `<li class="task" style="--c:${c.color}">
              <span class="cat-l">${c.name.split('/')[0]}</span>
              <span class="t">${esc(t.text)}</span>
            </li>`;
          }).join('')}
        </ul>
      </div>
    `;
  }

  v.innerHTML = html;
}

function renderAiView(v) {
  const ai = state.ai;
  if (!ai) return;

  let html = `
    <div class="ai-intro">
      <h2>✨ Phân tích tự động & Gợi ý thông minh</h2>
      <p>Hệ thống tự động phát hiện chu kỳ công việc, nhắc nhở nhiệm vụ sắp tới và phát hiện các việc cần tiếp tục theo dõi dựa trên lịch sử dữ liệu của bạn.</p>
    </div>
  `;

  /* 1. Việc sắp tới / Dự báo */
  html += `<div class="sec"><h3>📅 Sắp tới & Dự báo (${ai.upcoming.length})</h3><p>Công việc đã ghi cho các ngày tới hoặc được dự báo lặp lại.</p>`;
  if (!ai.upcoming.length) html += '<p class="muted">Không có lịch làm việc hoặc dự báo nào cho những ngày tới.</p>';
  else {
    html += ai.upcoming.map(u => {
      const diff = Math.round((startOfDay(u.when) - todayStart()) / 864e5);
      const whenStr = diff === 0 ? 'Hôm nay' : diff === 1 ? 'Ngày mai' : `Sau ${diff} ngày (${fmtDM(u.when)})`;
      return `
        <div class="item" style="--c:var(--navy)">
          <div>
            <span class="kind" style="--c:${u.kind === 'sched' ? '#047857' : u.kind === 'predict' ? '#6d28d9' : '#d97706'}">
              ${u.kind === 'sched' ? 'Trong lịch' : u.kind === 'predict' ? 'Dự báo lặp lại' : 'Nhắc trong bài'}
            </span>
            <div class="ttl">${esc(u.title)}</div>
            <div class="sub">${esc(u.sub)}</div>
          </div>
          <div class="when" style="--c:var(--navy)">${whenStr}</div>
        </div>
      `;
    }).join('');
  }
  html += '</div>';

  /* 2. Cần theo dõi thêm */
  html += `<div class="sec"><h3>👀 Cần tiếp tục theo dõi (${ai.follow.length})</h3><p>Ghi nhận gần đây chứa các từ khóa như "tiếp tục", "phân công", "tối ưu", "dự kiến"…</p>`;
  if (!ai.follow.length) html += '<p class="muted">Không có công việc nào cần chú ý đặc biệt gần đây.</p>';
  else {
    html += ai.follow.map(f => {
      const c = catById(f.t.cat);
      return `
        <div class="item" style="--c:${c.color}">
          <div>
            <div class="ttl">${esc(f.t.text)}</div>
            <div class="sub">Ngày ${fmtDMY(f.t.day.date)} (${WD_FULL[f.t.day.wd]}) · Từ khóa: <b>${esc(f.kw)}</b></div>
          </div>
          <button class="btn mini" data-act="filterids" data-ids="${f.t.id}" data-lbl="Công việc ngày ${fmtDM(f.t.day.date)}">Xem</button>
        </div>
      `;
    }).join('');
  }
  html += '</div>';

  /* 3. Chu kỳ định kỳ */
  html += `<div class="sec"><h3>🔄 Công việc lặp lại định kỳ (${ai.recurring.length})</h3><p>Các nhóm việc xuất hiện nhiều lần theo thói quen hoặc chu kỳ hằng tuần.</p>`;
  if (!ai.recurring.length) html += '<p class="muted">Chưa phát hiện công việc lặp lại nào.</p>';
  else {
    html += ai.recurring.map(r => {
      const c = catById(r.cat);
      return `
        <div class="item" style="--c:${c.color}">
          <div>
            <div class="ttl">${esc(r.text)}</div>
            <div class="sub">${r.pattern} · Gần nhất ngày ${fmtDMY(r.last)}</div>
          </div>
          <button class="btn mini" data-act="filterids" data-ids="${r.ids.join(',')}" data-lbl="${esc(r.text)} (${r.days} lần)">Xem ${r.days} lần</button>
        </div>
      `;
    }).join('');
  }
  html += '</div>';

  v.innerHTML = html;
}

/* ========================= SỰ KIỆN ========================= */
function bindEvents() {
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;

    if (act === 'refresh') loadData(true);
    else if (act === 'wd') {
      const v = +btn.dataset.v;
      if (state.f.wd.has(v)) state.f.wd.delete(v); else state.f.wd.add(v);
      renderAll();
    }
    else if (act === 'cat') {
      const v = btn.dataset.v;
      if (state.f.cats.has(v)) state.f.cats.delete(v); else state.f.cats.add(v);
      renderAll();
    }
    else if (act === 'quick') {
      const r = btn.dataset.r;
      const today = todayStart();
      state.f.month = ''; state.f.week = '';
      if (r === 'all') { state.f.from = ''; state.f.to = ''; }
      else if (r === 'today') { state.f.from = dkey(today); state.f.to = dkey(today); }
      else if (r === 'week') {
        const w0 = addDays(today, -(today.getDay() + 6) % 7);
        state.f.from = dkey(w0); state.f.to = dkey(addDays(w0, 6));
      }
      else if (r === 'last7') { state.f.from = dkey(addDays(today, -6)); state.f.to = dkey(today); }
      else if (r === 'month') {
        const m0 = new Date(today.getFullYear(), today.getMonth(), 1);
        const m1 = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        state.f.from = dkey(m0); state.f.to = dkey(m1);
      }
      renderAll();
    }
    else if (act === 'clear') {
      state.f = { q: '', month: '', week: '', from: '', to: '', wd: new Set(), cats: new Set(), ids: null, idsLabel: '' };
      $('#q').value = '';
      renderAll();
    }
    else if (act === 'clearq') { state.f.q = ''; $('#q').value = ''; renderAll(); }
    else if (act === 'kw') { state.f.q = btn.dataset.v; $('#q').value = state.f.q; renderAll(); }
    else if (act === 'tab') { state.tab = btn.dataset.v; renderTabs(); renderView(); }
    else if (act === 'filterids') {
      state.f.ids = new Set(btn.dataset.ids.split(','));
      state.f.idsLabel = btn.dataset.lbl || 'Danh sách việc đã chọn';
      state.tab = 'search';
      renderAll();
    }
    else if (act === 'clearids') { state.f.ids = null; state.f.idsLabel = ''; renderAll(); }
    else if (act === 'calcell') {
      const dk = btn.dataset.dk;
      if (dk) { state.calSel = state.calSel === dk ? null : dk; renderView(); }
    }
  });

  $('#q').addEventListener('input', e => { state.f.q = e.target.value; $('#sbox').classList.toggle('has', !!state.f.q); renderStats(); renderView(); });
  $('#fMonth').addEventListener('change', e => { state.f.month = e.target.value; state.f.week = ''; renderAll(); });
  $('#fWeek').addEventListener('change', e => { state.f.week = e.target.value; state.f.month = ''; renderAll(); });
  $('#fFrom').addEventListener('change', e => { state.f.from = e.target.value; renderAll(); });
  $('#fTo').addEventListener('change', e => { state.f.to = e.target.value; renderAll(); });

  document.addEventListener('change', e => {
    if (e.target.id === 'sortSel') { state.sort = e.target.value; renderView(); }
    if (e.target.id === 'calMoSel') { state.calMonth = e.target.value; state.calSel = null; renderView(); }
    if (e.target.id === 'autoChk' || e.target.id === 'autoSec') setupAuto();
  });
}

/* ========================= KHỞI CHẠY ========================= */
window.addEventListener('DOMContentLoaded', () => {
  try {
    const saved = JSON.parse(localStorage.getItem('wl_auto') || '{}');
    if (saved.on !== undefined) $('#autoChk').checked = saved.on; else $('#autoChk').checked = CONFIG.AUTO_DEFAULT_ON;
    if (saved.sec) $('#autoSec').value = saved.sec; else $('#autoSec').value = CONFIG.AUTO_DEFAULT_SEC;
  } catch (e) {
    $('#autoChk').checked = CONFIG.AUTO_DEFAULT_ON;
    $('#autoSec').value = CONFIG.AUTO_DEFAULT_SEC;
  }

  bindEvents();
  setupAuto();
  loadData(false);
});
</script>
</body>
</html>
